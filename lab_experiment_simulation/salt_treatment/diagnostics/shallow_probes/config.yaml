# Diagnostic - salt treatment, initial water from the shallow VWC probes only.
# Same 12-18 Aug window as the salt-treatment scenario. Salt concentration is still the
# side conductivity probe (one per side; those records are not split shallow/deep).
# soil0 matric tracks the left side and soil1 the right.
#
# From the repo root:
# Run:   python lab_experiment_simulation/run_simulation.py lab_experiment_simulation/salt_treatment/diagnostics/shallow_probes/config.yaml
# Plot:  python lab_experiment_simulation/post_processing.py lab_experiment_simulation/salt_treatment/diagnostics/shallow_probes/config.yaml --batch latest

simulation:
  name: tree1                         # time series file name: timeseries/<name>.csv
  species: Pecan                      # class name in species_traits.py
  weather_file: data/weather_data/lab_weather_data/Lab_Weather_Joined_Interp30_throughOct17.xlsx   # 30-min lab weather; the run uses the burn-in start onward
  timestepM: 30                       # model timestep (min)
  start_date: 2026-08-12              # first day compared with data (00:00)
  end_date: 2026-08-18                # last day compared with data (inclusive)
  burn_in_days: 3                     # before start_date: soil held at initial values, no salt uptake
  soil_texture: Berger                # class name in soil.py; its porosity N converts VWC to s
  soil_formulation: clapp_hornberger  # Berger only: van_genuchten or clapp_hornberger
  psi_wf_mode: bartlett               # storage psi_w formulation (stem and leaf)
  gwmax_mode: equation                # equation: GWMAX from VWT and species CAP; manual: use params.GWMAX_manual

lab:
  tree: 1
  sides: [left, right]                # compartment order: left is sensor 2, right is sensor 3
  container_volume_mL: 4318           # soil volume per side; compartment depth = volume / ground area
  ground_area_cm2: 210                # soil area per side (Bucket Info tab)
  root_area_cm2: {left: 2.65, right: 1.57}   # measured root cross-section (cm2); sap flux comparison
  vwc_file: data/soil_data/vwc_data/vwc_processed.csv
  vwc_depths: [shallow]           # initial s from the shallow probe only
  conductivity_file: data/soil_data/matric_potential_conductivity/matric_conductivity_processed.csv
  conductivity_cols: {left: cond_pw_2_mM, right: cond_pw_3_mM}   # pore-water EC, mM
  matric_cols: {left: soil0_matric_MPa, right: soil1_matric_MPa}
  irrigation_file: data/tree_and_watering_data/split_tree_water_salt_inputs.csv   # volumes in L, salt in mol
  sap_flux_file: data/sap_flux/sap_velocity_tree1_processed.csv                   # sap velocity in mm/s
  initial_before_pulses: true        # start-date mean stops before the first water or salt pulse
  plant_salt_from_soil: true         # c_stem and c_leaf = mean of the initial compartment concentrations

# Model parameters (Phase 2 baseline). s_init and cs_init are set from the lab data at run time.
params:
  LAI: 2                  # leaf area index (m2/m2); this tree, greenhouse measurement. Overrides Pecan.LAI

  # Stem storage
  pi0_stem: -1.1          # osmotic potential at full turgor (MPa)
  wft_stem: 1.0           # relative water content at full turgor (-)
  wr_stem: 0.40           # residual water fraction (-)
  eta_stem: 5.8           # bulk elastic modulus (MPa)
  mcap_stem: 12           # slope of psi_w above full turgor (MPa)
  vwi_stem: 0.85          # initial storage fraction (-)
  c_stem: 13.5            # replaced at run time when plant_salt_from_soil is set (mol/m3)
  c_stem_max: null        # cap for dynamic E; null uses max soil cs
  VWT: 0.011              # max stem storage (m3/m2 leaf); Pecan value
  GWMAX_manual: null      # used only when gwmax_mode is manual (um/(MPa s))

  # Leaf storage
  pi0_leaf: -1.4          # osmotic potential at full turgor (MPa)
  wft_leaf: 1.0           # relative water content at full turgor (-)
  wr_leaf: 0.46           # residual water fraction (-); Rieger and Daniell, Pecan
  eta_leaf: 17.5          # bulk elastic modulus (MPa)
  mcap_leaf: 12           # slope of psi_w above full turgor (MPa)
  vwi_leaf: 0.90          # initial storage fraction (-)
  c_leaf: 7.0             # replaced at run time when plant_salt_from_soil is set (mol/m3)
  VWTLEAF: 0.00005        # max leaf storage (m3/m2 leaf)
  GWMAXLEAF: 0.0005       # leaf storage-to-xylem conductance (um/(MPa s))

  # Roots
  root_frac: [0.5, 0.5]   # root fraction per compartment (-)
  B_param: 10000          # root length density parameter
  kr: 1.0e-8              # root radial permeability (m/s)
  F_CAP: 0.5              # relative position of the stem storage node along the hydraulic path (-)

  # Soil water losses besides root uptake
  drainage: false         # gravity drainage (soil leak) out of the compartment; off for containers
  soil_evaporation: true  # bare-soil evaporation from the compartment surface

  # Salt and conductance
  salt_uptake: true
  dynamic_E: true         # E rises from its set value toward 1 as c_stem approaches c_stem_max
  E: 0.95                 # salt filtration efficiency (-)
  leaf_uptake_frac: 1.0   # partition coefficient C_l = delta c_leaf / delta c_stem (-)
  gcut: species           # "species" uses Pecan.GCUT, or give a number (mm/s)

# Read by post_processing.py at plot time, so edits here apply without re-running.
plots:
  common:
    figsize: [9, 3.0]               # width, height per panel (in)
    dpi: 300
    format: png
    font_size: 10
    linewidth: 1.2
    model_color: "#08519c"
    data_color: "#6baed6"               # light blue, distinct from the model blue
    legend:
      loc: upper left
      bbox_to_anchor: [1.01, 1.0]
      fontsize: small
      frameon: false

  sap_flux_vs_uptake:
    enabled: true
    title: null
    panel_titles: ["Left side", "Right side"]
    ylabel: "Flux ($\\mu$m s$^{-1}$)"
    ylim: null

  relative_water_content:
    enabled: true
    title: null
    panel_titles: ["Left side", "Right side"]
    ylabel: "Relative water content $s$ (-)"
    ylim: null

  soil_salt:
    enabled: true
    title: null
    panel_titles: ["Left side", "Right side"]
    ylabel: "Salt concentration (mM)"
    ylim: [[0, 35], null]           # left panel capped; right panel stays automatic

  matric_potential:
    enabled: true
    title: null
    panel_titles: ["Left side", "Right side"]
    ylabel: "Matric potential (MPa)"
    ylim: null
