# Phase 2 - root conductance x FE
# Targeted runs covarying soil-root conductance and salt filtration efficiency (E).
# Root conductance is varied two ways, each as its own 3 x 3 factorial run group:
#   kr_E: root radial permeability kr x E
#   B_E:  root length density B_param x E
# Everything not listed under `runs` is held at `baseline`.
#
# From the repo root:
# Run:   python sensitivity_analysis/sensitivity_analysis.py "sensitivity_analysis/Phase 2 - root conductance x FE/config.yaml"
# Plot:  python sensitivity_analysis/post_processing.py "sensitivity_analysis/Phase 2 - root conductance x FE/config.yaml" --batch latest

phase:
  name: "Phase 2 - root conductance x FE"
  description: >
    Full factorial of root conductance (via kr or B_param) and filtration
    efficiency E at low/med/high levels, with salt uptake and dynamic E on,
    in wet soil with salt in compartment 2.

simulation:
  species: Pecan                      # class name in species_traits.py
  weather_file: data/weather_data/lab_weather_data/Lab_Weather_Summer_Average_Day_30min.xlsx   # average summer day repeated for 45 days at 30 min
  timestepM: 30                       # model timestep (min)
  burn_in_days: 7                     # soil held constant, no salt uptake
  analysis_days: 15                   # window after burn-in; total = 22 days (weather allows up to 38)
  zr_arr: species                     # compartment depths (m); "species" = species ZR per compartment, or a list
  psi_wf_mode: bartlett               # storage psi_w formulation (stem and leaf)
  gwmax_mode: equation                # equation: GWMAX from VWT and species CAP; manual: use baseline.GWMAX_manual
  enable_post_burn_cs_reset: true     # apply scenario post_burn_cs at end of burn-in

# Same as Phase 1 except kr (new), salt_uptake and dynamic_E.
baseline:
  # Stem storage
  pi0_stem: -1.1          # osmotic potential at full turgor (MPa)
  wft_stem: 1.0           # relative water content at full turgor (-)
  wr_stem: 0.40           # residual water fraction (-)
  eta_stem: 5.8           # bulk elastic modulus (MPa)
  mcap_stem: 12           # slope of psi_w above full turgor (MPa)
  vwi_stem: 0.85          # initial storage fraction (-)
  c_stem: 5.0             # initial storage salt concentration (mol/m3)
  c_stem_max: null        # cap for dynamic E; null uses max soil cs
  VWT: 0.011              # max stem storage (m3/m2 leaf); Pecan value
  GWMAX_manual: null      # used only when gwmax_mode is manual (um/(MPa s)); equation gives ~0.224

  # Leaf storage
  pi0_leaf: -1.4          # osmotic potential at full turgor (MPa)
  wft_leaf: 1.0           # relative water content at full turgor (-)
  wr_leaf: 0.46           # residual water fraction (-); Rieger and Daniell, Pecan
  eta_leaf: 17.5          # bulk elastic modulus (MPa); notebook value, hydraulics default is 5
  mcap_leaf: 12           # slope of psi_w above full turgor (MPa)
  vwi_leaf: 0.90          # initial storage fraction (-)
  c_leaf: null            # null uses c_stem
  VWTLEAF: 0.00005        # max leaf storage (m3/m2 leaf); Pecan value (from American beech)
  GWMAXLEAF: 0.0005       # leaf storage-to-xylem conductance (um/(MPa s)); Pecan value (from American beech)

  # Soil and roots
  s_init: [0.45, 0.45]    # initial relative soil moisture per compartment (-)
  cs_init: [0.0, 0.0]     # initial soil salinity per compartment (mM)
  root_frac: [0.5, 0.5]   # root fraction per compartment (-)
  B_param: 10000          # root length density parameter
  kr: 1.0e-8              # root radial permeability (m/s); value previously hard-coded in hydraulics.gsr
  F_CAP: 0.5              # relative position of the stem storage node along the hydraulic path (-)

  # Salt and conductance
  salt_uptake: true
  dynamic_E: true         # E rises from its set value toward 1 as c_stem approaches c_stem_max
  E: 0.95                 # salt filtration efficiency (-); starting value when dynamic_E is on
  leaf_uptake_frac: 0.5   # share of salt uptake allocated to leaf (volume weighted)
  gcut: species           # "species" uses Pecan.GCUT, or give a number (mm/s)

# Scenario keys override baseline; post_burn_* keys control the soil after burn-in.
scenarios:
  S4:
    label: Salt, wet
    s_init: [0.45, 0.45]
    cs_init: [0.0, 100.0]
    post_burn_cs: [0.0, 100.0]
    post_burn_soil_dynamics: [constant, constant]
  S5:
    label: Salt both, wet
    s_init: [0.45, 0.45]
    cs_init: [100.0, 100.0]
    post_burn_cs: [100.0, 100.0]
    post_burn_soil_dynamics: [constant, constant]

# S4: compartment 2 psi_s (~-0.50 MPa) stays below the root node (~-0.29 MPa), so roots leak
# water into it and take up no salt; S5 forces uptake from salty soil.
active_scenarios: [S4, S5]

# Each run overrides baseline keys; every run is repeated for each active scenario.
# `group` splits the figures: figures/<scenario>/<group>/.
runs:
  - {name: kr_lo__E_lo,  group: kr_E, kr: 1.0e-9, E: 0.80}
  - {name: kr_lo__E_med, group: kr_E, kr: 1.0e-9, E: 0.90}
  - {name: kr_lo__E_hi,  group: kr_E, kr: 1.0e-9, E: 0.95}
  - {name: kr_med__E_lo,  group: kr_E, kr: 1.0e-8, E: 0.80}
  - {name: kr_med__E_med, group: kr_E, kr: 1.0e-8, E: 0.90}
  - {name: kr_med__E_hi,  group: kr_E, kr: 1.0e-8, E: 0.95}
  - {name: kr_hi__E_lo,  group: kr_E, kr: 1.0e-7, E: 0.80}
  - {name: kr_hi__E_med, group: kr_E, kr: 1.0e-7, E: 0.90}
  - {name: kr_hi__E_hi,  group: kr_E, kr: 1.0e-7, E: 0.95}
  - {name: B_lo__E_lo,  group: B_E, B_param: 5000, E: 0.80}
  - {name: B_lo__E_med, group: B_E, B_param: 5000, E: 0.90}
  - {name: B_lo__E_hi,  group: B_E, B_param: 5000, E: 0.95}
  - {name: B_med__E_lo,  group: B_E, B_param: 10000, E: 0.80}
  - {name: B_med__E_med, group: B_E, B_param: 10000, E: 0.90}
  - {name: B_med__E_hi,  group: B_E, B_param: 10000, E: 0.95}
  - {name: B_hi__E_lo,  group: B_E, B_param: 20000, E: 0.80}
  - {name: B_hi__E_med, group: B_E, B_param: 20000, E: 0.90}
  - {name: B_hi__E_hi,  group: B_E, B_param: 20000, E: 0.95}

# Read by post_processing.py at plot time, so edits here apply without re-running.
# x axis is days since end of burn-in. Legend entries are each run's override values,
# written with display_names. Colour = root conductance level, line style = E level.
# ylim: null for auto, [min, max] for all panels, or a list of [min, max] per panel.
plots:
  common:
    window_days: [0, 15]
    figsize: [8, 3.5]               # width, height per panel (in)
    dpi: 300
    format: png
    font_size: 10
    linewidth: 1.2
    run_colors:
      kr_lo__E_lo: "#9ecae1"
      kr_lo__E_med: "#9ecae1"
      kr_lo__E_hi: "#9ecae1"
      kr_med__E_lo: "#4292c6"
      kr_med__E_med: "#4292c6"
      kr_med__E_hi: "#4292c6"
      kr_hi__E_lo: "#08519c"
      kr_hi__E_med: "#08519c"
      kr_hi__E_hi: "#08519c"
      B_lo__E_lo: "#fdae6b"
      B_lo__E_med: "#fdae6b"
      B_lo__E_hi: "#fdae6b"
      B_med__E_lo: "#f16913"
      B_med__E_med: "#f16913"
      B_med__E_hi: "#f16913"
      B_hi__E_lo: "#a63603"
      B_hi__E_med: "#a63603"
      B_hi__E_hi: "#a63603"
    run_linestyles:
      kr_lo__E_lo: ":"
      kr_lo__E_med: "--"
      kr_lo__E_hi: "-"
      kr_med__E_lo: ":"
      kr_med__E_med: "--"
      kr_med__E_hi: "-"
      kr_hi__E_lo: ":"
      kr_hi__E_med: "--"
      kr_hi__E_hi: "-"
      B_lo__E_lo: ":"
      B_lo__E_med: "--"
      B_lo__E_hi: "-"
      B_med__E_lo: ":"
      B_med__E_med: "--"
      B_med__E_hi: "-"
      B_hi__E_lo: ":"
      B_hi__E_med: "--"
      B_hi__E_hi: "-"
    xlabel: "Days"
    display_names:                  # parameter name -> legend text (matplotlib mathtext)
      kr: "$k_r$"
      B_param: "$B$"
      E: "$FE$"
    legend:                         # any key can be overridden in a figure block
      title: null
      loc: upper left
      bbox_to_anchor: [1.01, 1.0]   # axes fraction; x > 1 places it right of the axes
      fontsize: small
      frameon: false

  photosynthesis:                   # dashed lines mark when the leaf-salt reduction switches on
    enabled: true
    variables: [a, photo_reduc]
    ylabels: ["Photosynthesis, $A$ ($\\mu$mol m$^{-2}$ s$^{-1}$)", "Salt reduction factor (-)"]
    onset_variable: photo_reduc
    onset_threshold: 0.0
    ylim: null
    title: "Photosynthesis and leaf-salt reduction"

  leaf_salt:
    enabled: true
    variables: [c_leaf, MW_uptake_leaf]
    ylabels: ["Leaf storage salt, $c_{leaf}$ (mol m$^{-3}$)", "Cumulative leaf salt uptake (mmol m$^{-2}$)"]
    scales: [1.0, 1000.0]           # MW_uptake_leaf mol -> mmol
    threshold: 24.3                 # c_leaf where photosynthesis reduction starts (C3_c_leaf_reduc)
    threshold_label: "Reduction threshold"
    threshold_panel: 0
    ylim: null
    title: "Leaf salt accumulation"

  transpiration:
    enabled: true
    variables: [ev]
    scale: 1.0
    ylabel: "Transpiration, $E$ ($\\mu$m s$^{-1}$)"
    ylim: null
    title: "Transpiration"

  root_uptake:
    enabled: true
    variables: [qs]                 # per-compartment pair; one panel per compartment
    compartments: [1, 2]
    panel_titles: ["Compartment 1", "Compartment 2 (salty)"]
    scale: 1.0
    ylabel: "Root water uptake, $q_s$ ($\\mu$m s$^{-1}$)"
    ylim: null
    title: "Root water uptake"

  soil_water_potential:
    enabled: true
    variables: [psi_s]              # per-compartment pair; one panel per compartment
    compartments: [1, 2]
    panel_titles: ["Compartment 1", "Compartment 2 (salty)"]
    scale: 1.0
    ylabel: "Soil water potential, $\\psi_s$ (MPa)"
    ylim: null                      # salt shifts compartment 2 far below Phase 1's [-0.07, 0]
    title: "Soil water potential"

  storage_fluxes:
    enabled: true
    variables: [qw_stem, qw_leaf]   # one panel per variable
    panel_titles: ["Stem storage", "Leaf storage"]
    scale: 1.0
    ylabel: "Storage flux ($\\mu$m s$^{-1}$)"
    ylim: null
    title: "Storage fluxes (positive = release to xylem)"

  psi_l:
    enabled: true
    variables: [psi_l]
    scale: 1.0
    ylabel: "Leaf water potential, $\\psi_l$ (MPa)"
    ylim: null
    title: "Leaf water potential"

  flux_partition:                   # one column per run (9 per group); likely first to switch off
    enabled: true
    title: "Transpiration supply partition"
    ylabels: ["Flux ($\\mu$m s$^{-1}$)", "Share of $E$ per step (%)", "Share of daily $E$ (%)"]
    flux_ylim: null
    share_ylim: null
    daily_ylim: null
    show_sum: true

