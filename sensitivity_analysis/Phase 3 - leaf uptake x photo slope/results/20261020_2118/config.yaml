# Phase 3 - leaf uptake fraction x photosynthesis reduction slope
# 3 x 3 factorial of the leaf-stem salt partition coefficient (C_l) and the
# slope of the leaf-salt photosynthesis reduction. Everything not listed
# under `runs` is held at `baseline`. The middle run is the Phase 2 baseline
# (C_l = 1.0, slope = 0.0355).
#
# C_l is the concentration-increase ratio delta c_leaf / delta c_stem. With
# VWT = 0.011 and VWTLEAF = 5e-5 the leaf's share of salt mass is
# C_l*VWTLEAF / (VWT + C_l*VWTLEAF): about 0.34%, 0.45% and 0.57% at
# C_l = 0.75, 1.0 and 1.25. The slope levels are the Campos-Villareal fit
# (0.0355 per mol/m3) times 0.75 and 1.25. The onset threshold stays at 12 mol/m3.
#
# From the repo root:
# Run:   python sensitivity_analysis/sensitivity_analysis.py "sensitivity_analysis/Phase 3 - leaf uptake x photo slope/config.yaml"
# Plot:  python sensitivity_analysis/post_processing.py "sensitivity_analysis/Phase 3 - leaf uptake x photo slope/config.yaml" --batch latest

phase:
  name: "Phase 3 - leaf uptake x photo slope"
  description: >
    Full factorial of leaf uptake fraction C_l (0.75, 1.0, 1.25) and the
    leaf-salt photosynthesis reduction slope (baseline 0.0355, plus or minus 25%),
    with salt uptake on and 100 mM salt in both compartments, soil held wet.

simulation:
  species: Pecan                      # class name in species_traits.py
  weather_file: data/weather_data/lab_weather_data/Lab_Weather_Summer_Average_Day_30min.xlsx   # average summer day repeated for 45 days at 30 min
  timestepM: 30                       # model timestep (min)
  burn_in_days: 7                     # soil held constant, no salt uptake
  analysis_days: 30                   # window after burn-in; total = 37 days (weather allows up to 38)
  zr_arr: species                     # compartment depths (m); "species" = species ZR per compartment, or a list
  soil_texture: SandyLoam             # class name in soil.py (e.g. Berger, SandyLoam, Loam)
  psi_wf_mode: bartlett               # storage psi_w formulation (stem and leaf)
  gwmax_mode: equation                # equation: GWMAX from VWT and species CAP; manual: use baseline.GWMAX_manual
  enable_post_burn_cs_reset: true     # apply scenario post_burn_cs at end of burn-in

# Same baseline as Phase 2, plus the reduction-function coefficients (previously hard-coded).
baseline:
  # Stem storage
  pi0_stem: -1.1          # osmotic potential at full turgor (MPa)
  wft_stem: 1.0           # relative water content at full turgor (-)
  wr_stem: 0.40           # residual water fraction (-)
  eta_stem: 5.8           # bulk elastic modulus (MPa)
  mcap_stem: 12           # slope of psi_w above full turgor (MPa)
  vwi_stem: 0.85          # initial storage fraction (-)
  c_stem: 13.5            # initial storage salt concentration (mol/m3); Campos-Villareal stem/root average
  c_stem_max: null        # cap for dynamic E; null uses max soil cs
  VWT: 0.011              # max stem storage (m3/m2 leaf); Pecan value
  GWMAX_manual: null      # used only when gwmax_mode is manual (um/(MPa s)); equation gives ~0.224

  # Leaf storage
  pi0_leaf: -1.4          # osmotic potential at full turgor (MPa)
  wft_leaf: 1.0           # relative water content at full turgor (-)
  wr_leaf: 0.46           # residual water fraction (-); Rieger and Daniell, Pecan
  eta_leaf: 17.5          # bulk elastic modulus (MPa); notebook value, hydraulics default is 5
  mcap_leaf: 12           # slope of psi_w above full turgor (MPa)
  vwi_leaf: 0.90          # initial storage fraction (-)
  c_leaf: 7.0             # initial leaf salt concentration (mol/m3); Campos-Villareal leaf; null uses c_stem
  VWTLEAF: 0.00005        # max leaf storage (m3/m2 leaf); Pecan value (from American beech)
  GWMAXLEAF: 0.0005       # leaf storage-to-xylem conductance (um/(MPa s)); Pecan value (from American beech)

  # Soil and roots
  s_init: [0.45, 0.45]    # initial relative soil moisture per compartment (-)
  cs_init: [0.0, 0.0]     # initial soil salinity per compartment (mM)
  root_frac: [0.5, 0.5]   # root fraction per compartment (-)
  B_param: 10000          # root length density parameter
  kr: 1.0e-8              # root radial permeability (m/s); Phase 2 baseline
  F_CAP: 0.5              # relative position of the stem storage node along the hydraulic path (-)

  # Salt and conductance
  salt_uptake: true
  dynamic_E: true         # E rises from its set value toward 1 as c_stem approaches c_stem_max
  E: 0.95                 # salt filtration efficiency (-); starting value when dynamic_E is on
  leaf_uptake_frac: 1.0   # partition coefficient C_l = delta c_leaf / delta c_stem (-); between Campos-Villareal L/S 0.7 and L/R 1.4
  gcut: species           # "species" uses Pecan.GCUT, or give a number (mm/s)

  # Photosynthesis reduction: factor = min(slope * max(c_leaf - threshold, 0), 0.9999)
  c_leaf_reduc_slope: 0.0355       # per mol/m3; Campos-Villareal treatment-mean fit
  c_leaf_reduc_threshold: 12.0     # mol/m3; onset. Held fixed in this phase (match plots.leaf_salt.threshold)

# Scenario keys override baseline; post_burn_* keys control the soil after burn-in.
scenarios:
  S5:
    label: Salt both, wet
    s_init: [0.45, 0.45]
    cs_init: [100.0, 100.0]
    post_burn_cs: [100.0, 100.0]
    post_burn_soil_dynamics: [constant, constant]

# 100 mM in both compartments so roots take salt up. Soil moisture held constant,
# so transpiration and gsw move only through the photosynthesis reduction.
active_scenarios: [S5]

# Each run overrides baseline keys; every run is repeated for each active scenario.
# Hue in the figures is C_l; shade is the reduction slope (light = low, dark = high).
runs:
  - {name: Cl_lo__m_lo,  leaf_uptake_frac: 0.75, c_leaf_reduc_slope: 0.026625}
  - {name: Cl_lo__m_med, leaf_uptake_frac: 0.75, c_leaf_reduc_slope: 0.0355}
  - {name: Cl_lo__m_hi,  leaf_uptake_frac: 0.75, c_leaf_reduc_slope: 0.044375}
  - {name: Cl_med__m_lo,  leaf_uptake_frac: 1.0, c_leaf_reduc_slope: 0.026625}
  - {name: Cl_med__m_med, leaf_uptake_frac: 1.0, c_leaf_reduc_slope: 0.0355}
  - {name: Cl_med__m_hi,  leaf_uptake_frac: 1.0, c_leaf_reduc_slope: 0.044375}
  - {name: Cl_hi__m_lo,  leaf_uptake_frac: 1.25, c_leaf_reduc_slope: 0.026625}
  - {name: Cl_hi__m_med, leaf_uptake_frac: 1.25, c_leaf_reduc_slope: 0.0355}
  - {name: Cl_hi__m_hi,  leaf_uptake_frac: 1.25, c_leaf_reduc_slope: 0.044375}

# Read by post_processing.py at plot time, so edits here apply without re-running.
# x axis is days since end of burn-in. Legend entries are each run's override values,
# written with display_names. Colour hue = C_l, shade = reduction slope.
# ylim: null for auto, [min, max] for all panels, or a list of [min, max] per panel.
plots:
  common:
    window_days: [0, 30]
    figsize: [8, 3.5]               # width, height per panel (in)
    dpi: 300
    format: png
    font_size: 10
    linewidth: 1.2
    run_colors:                     # hue = C_l (green 0.75, blue 1.0, purple 1.25); shade = slope (light low to dark high)
      Cl_lo__m_lo: "#a1d99b"
      Cl_lo__m_med: "#41ab5d"
      Cl_lo__m_hi: "#005a32"
      Cl_med__m_lo: "#9ecae1"
      Cl_med__m_med: "#4292c6"
      Cl_med__m_hi: "#08519c"
      Cl_hi__m_lo: "#bcbddc"
      Cl_hi__m_med: "#807dba"
      Cl_hi__m_hi: "#3f007d"
    xlabel: "Days"
    display_names:                  # parameter name -> legend text (matplotlib mathtext)
      leaf_uptake_frac: "$C_l$"
      c_leaf_reduc_slope: "$m_c$"
    legend:                         # any key can be overridden in a figure block
      title: null
      loc: upper left
      bbox_to_anchor: [1.01, 1.0]   # axes fraction; x > 1 places it right of the axes
      fontsize: small
      frameon: false

  transpiration:
    enabled: true
    variables: [ev]
    scale: 1.0
    ylabel: "Transpiration, $E$ ($\\mu$m s$^{-1}$)"
    ylim: null
    title: "Transpiration"

  stomatal_conductance:
    enabled: true
    variables: [gsw]
    scale: 1.0
    ylabel: "Stomatal conductance, $g_{sw}$ (mol m$^{-2}$ s$^{-1}$)"
    ylim: null
    title: "Stomatal conductance"

  photosynthesis:                   # dashed lines mark when the leaf-salt reduction switches on
    enabled: true
    variables: [a, photo_reduc]
    ylabels: ["Photosynthesis, $A$ ($\\mu$mol m$^{-2}$ s$^{-1}$)", "Salt reduction factor (-)"]
    onset_variable: photo_reduc
    onset_threshold: 0.0
    ylim: null
    title: "Photosynthesis and leaf-salt reduction"

  leaf_salt:                        # C_l sets how fast c_leaf approaches the threshold; c_stem gets the rest
    enabled: true
    variables: [c_leaf, c_stem]
    ylabels: ["Leaf storage salt, $c_{leaf}$ (mol m$^{-3}$)", "Stem storage salt, $c_{stem}$ (mol m$^{-3}$)"]
    panel_titles: ["Leaf storage", "Stem storage"]
    threshold: 12.0                 # c_leaf where photosynthesis reduction starts (c_leaf_reduc_threshold)
    threshold_label: "Onset of\nphotosynthetic\nreduction"
    threshold_panel: 0
    ylim: null
    title: "Storage salt"
    title_context: false

  pi0:                              # van't Hoff shift from the salt each compartment actually receives
    enabled: true
    variables: [pi0_leaf, pi0_stem]
    panel_titles: ["Leaf storage", "Stem storage"]
    ylabels: ["$\\pi_{0,leaf}$ (MPa)", "$\\pi_{0,stem}$ (MPa)"]
    ylim: null
    title: "Osmotic potential at full turgor"

  psi_l:                            # relaxes if the reduction cuts transpiration
    enabled: true
    variables: [psi_l]
    scale: 1.0
    ylabel: "Leaf water potential, $\\psi_l$ (MPa)"
    ylim: null
    title: "Leaf water potential"

  salt_response_table:              # LaTeX table: 30-day leaf delta pi0 and days to photo reduction
    enabled: true
    variable: pi0_leaf
    onset_variable: photo_reduc
    onset_threshold: 0.0
    caption: "30-day leaf osmotic adjustment and days until the onset of photosynthetic reduction"
    label: "tab:phase3_salt_response"

