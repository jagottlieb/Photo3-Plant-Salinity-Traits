# Phase 1 diagnostic: pi0 when both soils are dry enough that nights stay below turgor loss.
# Compartment 1 dries from s = 0.17. Compartment 2 is held at s = 0.20
# (psi_s about -4.1 and -1.86 MPa). Stem turgor loss is about -1.1 to -1.7 MPa,
# so the held side cannot refill the stem above turgor loss.
# VWT stays at baseline. The wetter runs are kept in diagnostics/vwt_hr.
# The live Phase 1 config is unchanged.
#
# From the repo root:
# Run:   python sensitivity_analysis/sensitivity_analysis.py "sensitivity_analysis/Phase 1 - pi0/diagnostics/pi0_dry_hr/config.yaml"
# Plot:  python sensitivity_analysis/post_processing.py "sensitivity_analysis/Phase 1 - pi0/diagnostics/pi0_dry_hr/config.yaml" --batch latest

phase:
  name: "Phase 1 - pi0"
  description: >
    S2_one only. Compartment 1 dries from s = 0.17. Compartment 2 is held at
    s = 0.20, drier than stem turgor loss. pi0 is varied at baseline stem storage.

simulation:
  species: Pecan                      # class name in species_traits.py
  weather_file: data/weather_data/lab_weather_data/Lab_Weather_Summer_Average_Day_30min.xlsx   # average summer day repeated for 45 days at 30 min
  timestepM: 30                       # model timestep (min)
  burn_in_days: 7                     # soil held constant, no salt uptake
  analysis_days: 5                    # window after burn-in; total = 12 days
  zr_arr: species                     # compartment depths (m); "species" = species ZR per compartment, or a list
  soil_texture: SandyLoam             # class name in soil.py (e.g. Berger, SandyLoam, Loam)
  psi_wf_mode: bartlett               # storage psi_w formulation (stem and leaf)
  gwmax_mode: equation                # equation: GWMAX from VWT and species CAP; manual: use baseline.GWMAX_manual
  enable_post_burn_cs_reset: true     # apply scenario post_burn_cs at end of burn-in

# All values match analysis_notebook_sensitivity_v3.ipynb unless noted.
baseline:
  # Stem storage
  pi0_stem: -1.1          # osmotic potential at full turgor (MPa)
  wft_stem: 1.0           # relative water content at full turgor (-)
  wr_stem: 0.40           # residual water fraction (-)
  eta_stem: 5.8           # bulk elastic modulus (MPa)
  mcap_stem: 12           # slope of psi_w above full turgor (MPa)
  vwi_stem: 0.85          # initial storage fraction (-)
  c_stem: 5.0             # initial storage salt concentration (mol/m3)
  c_stem_max: null        # cap for dynamic E; null uses max soil cs
  LAI: 8.5               # non-split lab saplings (m2 leaf/m2 ground). Split-root lab runs use 2
  VWT: 0.000854          # max stem storage (m3/m2 leaf); 1.5 m x 1 cm cylinder / 0.0842 m2 leaf (842 cm2)
  GWMAX_manual: null      # used only when gwmax_mode is manual (um/(MPa s)); equation gives ~0.0174

  # Leaf storage
  pi0_leaf: -1.4          # osmotic potential at full turgor (MPa)
  wft_leaf: 1.0           # relative water content at full turgor (-)
  wr_leaf: 0.46           # residual water fraction (-); Rieger and Daniell, Pecan
  eta_leaf: 17.5          # bulk elastic modulus (MPa); notebook value, hydraulics default is 5
  mcap_leaf: 12           # slope of psi_w above full turgor (MPa)
  vwi_leaf: 0.90          # initial storage fraction (-)
  c_leaf: null            # null uses c_stem
  VWTLEAF: 0.00005        # max leaf storage (m3/m2 leaf); Pecan value (from American beech)
  GWMAXLEAF: 0.0005       # leaf storage-to-xylem conductance (um/(MPa s)); Pecan value (from American beech)

  # Soil and roots
  s_init: [0.45, 0.45]    # initial relative soil moisture per compartment (-)
  cs_init: [0.0, 0.0]     # initial soil salinity per compartment (mM)
  root_frac: [0.5, 0.5]   # root fraction per compartment (-)
  B_param: 10000          # root length density parameter
  F_CAP: 0.5              # relative position of the stem storage node along the hydraulic path (-)
  gpmax_scale: 1.0        # multiplies species GPMAX (1.0 = species value)

  # Salt and conductance
  salt_uptake: false
  dynamic_E: false
  E: 0.95                 # salt filtration efficiency (-); hydraulics default is 0.99
  leaf_uptake_frac: 1.0   # partition coefficient C_l = delta c_leaf / delta c_stem (-); between Campos-Villareal L/S 0.7 and L/R 1.4
  gcut: species           # "species" uses Pecan.GCUT, or give a number (mm/s)

# Scenario keys override baseline; post_burn_* keys control the soil after burn-in.
scenarios:
  S1:
    label: Baseline
    cs_init: [0.0, 0.0]
    post_burn_cs: [0.0, 0.0]
    post_burn_soil_dynamics: [constant, constant]
  S2:
    label: Drydown
    s_init: [0.42, 0.42]                # SandyLoam, 0.2 m compartments: total soil-root conductance ~1.9 (~1.3x gp*LAI ~1.45) at start, psi_s ~-0.05 MPa;
                                        # it falls below gp*LAI near s ~0.39 (psi_s ~-0.075 MPa), so drought stress begins soon after burn-in
    cs_init: [0.0, 0.0]
    post_burn_cs: [0.0, 0.0]
    post_burn_soil_dynamics: [drydown, drydown]
  S2_one:
    label: Both sides dry, drier side drydown
    s_init: [0.17, 0.20]                # compartment 1 dries from s = 0.17 (psi_s ~-4 MPa); compartment 2 held at s = 0.20 (psi_s ~-1.86 MPa)
    cs_init: [0.0, 0.0]
    post_burn_cs: [0.0, 0.0]
    post_burn_soil_dynamics: [drydown, constant]
  S3:
    label: Drydown & Salt
    salt_uptake: true
    dynamic_E: true
    cs_init: [0.0, 100.0]
    post_burn_cs: [0.0, 100.0]
    post_burn_soil_dynamics: [drydown, constant]

# S2_one only: drier side dries from 0.17; wetter side held at 0.20.
active_scenarios: [S2_one]

# Each run overrides baseline keys; every run is repeated for each active scenario.
runs:
  - {name: low,  pi0_leaf: -1.1, pi0_stem: -0.9}
  - {name: med,  pi0_leaf: -1.4, pi0_stem: -1.1}
  - {name: high, pi0_leaf: -1.7, pi0_stem: -1.3}

# Read by post_processing.py at plot time, so edits here apply without re-running.
# x axis is days since end of burn-in. Legend entries are each run's override values,
# written with display_names.
# ylim: null for auto, [min, max] for all panels, or a list of [min, max] per panel.
plots:
  common:
    window_days: [0, 5]
    figsize: [8, 3.5]               # width, height per panel (in)
    dpi: 300
    format: png
    font_size: 10
    linewidth: 1.2
    run_colors: {low: "#9ecae1", med: "#4292c6", high: "#08519c"}
    xlabel: "Days"
    display_names:
      pi0_leaf: "$\\pi_{0,leaf}$"
      pi0_stem: "$\\pi_{0,stem}$"
    legend:                         # any key can be overridden in a figure block
      title: null                   # e.g. "$\\pi_0$ (MPa)"
      loc: upper left
      bbox_to_anchor: [1.01, 1.0]   # axes fraction; x > 1 places it right of the axes
      fontsize: small
      frameon: false

  transpiration:
    enabled: true
    variables: [ev]
    scale: 1.0
    ylabel: "Transpiration, $E$ ($\\mu$m s$^{-1}$)"
    ylim: null
    title: "Transpiration"

  root_uptake:
    enabled: true
    variables: [qs]                 # per-compartment pair; one panel per compartment
    compartments: [1, 2]
    panel_titles: ["Compartment 1", "Compartment 2"]
    scale: 1.0
    ylabel: "Root water uptake, $q_s$ ($\\mu$m s$^{-1}$)"
    ylim: null                      # shared by both compartment panels
    title: "Root water uptake"

  soil_water_potential:
    enabled: true
    variables: [psi_s]              # per-compartment pair; one panel per compartment
    compartments: [1, 2]
    panel_titles: ["Compartment 1", "Compartment 2"]
    scale: 1.0
    ylabel: "Soil water potential, $\\psi_s$ (MPa)"
    ylim: null                      # shared by both compartment panels
    title: "Soil water potential"

  storage_soil_potential:          # solid = storage; dashed = soil 1; dotted = soil 2; color = pi0 run
    enabled: true
    storage_variables: [psi_w_stem, psi_w_leaf]
    panel_titles: ["Stem storage", "Leaf storage"]
    ylabel: "Water potential (MPa)"
    ylim: null
    title: "Storage and soil water potential"

  soil_moisture:
    enabled: true
    variables: [s]
    compartments: [1, 2]
    panel_titles: ["Compartment 1", "Compartment 2"]
    scale: 1.0
    ylabel: "Relative soil moisture, $s$ (-)"
    ylim: null
    title: "Soil moisture"

  night_hr:
    enabled: true
    compartments: [1, 2]
    panel_titles: ["Compartment 1", "Compartment 2"]
    ylabel: "Nightly efflux (mm)"
    ylim: null
    title: "Nightly hydraulic redistribution"

  storage_fluxes:
    enabled: true
    variables: [qw_stem, qw_leaf]   # one panel per variable
    panel_titles: ["Stem storage", "Leaf storage"]
    scale: 1.0
    ylabel: "Storage flux ($\\mu$m s$^{-1}$)"
    ylim: null
    title: "Storage fluxes (positive = release to xylem)"

  psi_l:
    enabled: true
    variables: [psi_l]
    scale: 1.0
    ylabel: "Leaf water potential, $\\psi_l$ (MPa)"
    ylim: null
    title: "Leaf water potential"

  flux_partition:                   # one column per run; rows: fluxes, share of E per step, share of daily E
    enabled: true
    title: "Transpiration supply partition"
    ylabels: ["Flux ($\\mu$m s$^{-1}$)", "Share of $E$ per step (%)", "Share of daily $E$ (%)"]
    flux_ylim: null                 # [min, max] or null for auto
    share_ylim: null                # signed shares; refilling is negative, root share can exceed 100%
    daily_ylim: null
    show_sum: true                  # thin black line: sum of shares, 100% when the water balance closes

  daily_transpiration:              # daily total E, one bar per run (run_colors) side by side for each day
    enabled: true
    title: "Daily transpiration"
    xlabel: "Day"
    ylabel: "Daily transpiration (mm)"
    ylim: null

  daily_storage:                    # daily stem + leaf storage discharge (above zero) and refill (below zero), one bar pair per run
    enabled: true
    title: "Daily storage discharge and refill"
    xlabel: "Day"
    ylabel: "Daily storage flux (mm)"
    ylim: null

  daily_storage_table:              # LaTeX table (figures/<scenario>/daily_storage_table.tex) matching daily_storage
    enabled: true
    days: [1, 5]                    # 1-based days since end of burn-in
    day_labels: {1: "1 (start of drydown)", 5: "5 (end of window)"}
    column_names: {low: Low, med: Medium, high: High}
    caption: "Daily stem and leaf storage discharge and refill (mm) at baseline stem volume; drier side dries from s = 0.17, other side held at 0.20"
    label: "tab:vwt_s2_one_daily_storage"
